name: macOS alpha prod smoke (single job)
on:
  push:
    branches:
      - 'mac-prod-smoke-*'
permissions:
  contents: read
jobs:
  smoke:
    name: macOS smoke
    runs-on: incredibuild-macos-latest
    timeout-minutes: 30
    steps:
      - name: Identify the Mac
        run: |
          date -u +%FT%TZ
          sw_vers
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          echo "runner_name=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH user=$(id -un)"
      - name: Runner version
        run: |
          RL=$(ps -axo command= | grep -m1 -oE '/[^ ]*/bin/Runner\.(Listener|Worker)' || true)
          echo "runner binary: $RL"
          [ -n "$RL" ] && "$(dirname "$RL")/Runner.Listener" --version || true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Small build (C, and one Rust crate)
        run: |
          printf '#include <stdio.h>\nint main(void){puts("hello from the prod Mac");return 0;}\n' > /tmp/hello.c
          clang -O2 -o /tmp/hello /tmp/hello.c && /tmp/hello
          cargo --version || true
          time cargo build -p nu-path --locked
